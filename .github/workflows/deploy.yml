name: Test & Deploy Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm test

  deploy:
    name: Deploy to Production
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: exa31/github-workflows/.github/workflows/frontend.yml@v1.0.0
    with:
      app_name: portofolio-v2
      namespace: portfolio
      image_name: ghcr.io/exa31/portofolio-v2
      rollout_timeout: 300s
      push_latest: true
      ssh_port: 31080
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
