<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top & Stem Gradient: Lime Green to Turquoise to Azure -->
    <linearGradient id="grad-top-stem" x1="95%" y1="10%" x2="10%" y2="80%">
      <stop offset="0%" stop-color="#6ed577" />
      <stop offset="28%" stop-color="#52d2a4" />
      <stop offset="58%" stop-color="#37c5cf" />
      <stop offset="85%" stop-color="#25a2d1" />
      <stop offset="100%" stop-color="#2282cd" />
    </linearGradient>

    <!-- Middle Bar Gradient: Azure to Bright Turquoise/Cyan -->
    <linearGradient id="grad-middle-bar" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e7ecb" />
      <stop offset="30%" stop-color="#229ed0" />
      <stop offset="70%" stop-color="#2cb6c7" />
      <stop offset="100%" stop-color="#34c4be" />
    </linearGradient>

    <!-- 3D Fold Facet Shadow: Deep Royal Blue / Cobalt -->
    <linearGradient id="grad-fold-shadow" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#1c5dbb" />
      <stop offset="50%" stop-color="#1950af" />
      <stop offset="100%" stop-color="#133f9e" />
    </linearGradient>

    <!-- Bottom Bar Gradient: Deep Royal Blue to Bright Azure -->
    <linearGradient id="grad-bottom-bar" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1f3ed9" />
      <stop offset="45%" stop-color="#1b63eb" />
      <stop offset="100%" stop-color="#168fed" />
    </linearGradient>
  </defs>

  <!-- 1. 3D Fold Facet Shadow -->
  <polygon points="31.3,302.2 81.7,369.4 127.9,302.2" fill="url(#grad-fold-shadow)" />

  <!-- 2. Main Ribbon Structure -->
  <polygon points="169.9,79.6 480.7,79.6 434.5,159.4 216.1,159.4 182.5,214.0 409.3,214.0 358.9,298.0 127.9,298.0 31.3,302.2" fill="url(#grad-top-stem)" />

  <!-- Middle Bar Gradient Overlay -->
  <polygon points="31.3,302.2 127.9,298.0 358.9,298.0 409.3,214.0 182.5,214.0" fill="url(#grad-middle-bar)" opacity="0.95" />

  <!-- 3. Bottom Floating Bar with Slanted Ends -->
  <polygon points="132.1,352.6 417.7,352.6 367.3,432.4 127.9,432.4 98.5,394.6" fill="url(#grad-bottom-bar)" />
</svg>